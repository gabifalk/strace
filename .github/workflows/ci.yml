name: CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SLEEP_A_BIT: sleep 0.2
  VERBOSE: 1

jobs:
  whitespace-errors:
    if: false
    name: Check for whitespace errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: check
        run: git diff-index --check --cached 4b825dc642cb6eb9a060e54bf8d69288fbee4904

  coverage: # the longest of all build jobs
    if: false
    name: Check coverage
    runs-on: ubuntu-latest
    env:
      CHECK: coverage
      CC: gcc
      TARGET: x86_64
      KHEADERS: torvalds/linux
      STACKTRACE: libdw
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install dependencies
        run: ci/install-dependencies.sh
      - name: build check
        run: ci/run-build-and-tests.sh
      - name: upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354	# v6.0.1
        with:
          fail_ci_if_error: true
          plugins: gcov
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: src

  build-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, target: x86_64, variant: musl, runner: ubuntu-24.04, container: 'ghcr.io/gabifalk/strace-musl-image:6.0', container_options: '--security-opt seccomp=unconfined' }
    name: Build ${{ matrix.cc }}-${{ matrix.target }}-${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      options: ${{ matrix.container_options }}
    env:
      CC: ${{ matrix.cc }}
      TARGET: ${{ matrix.target }}
    steps:
      # Pretend we are running "alpine" here.
      # https://github.com/actions/runner/issues/3852
      - name: Make the runner use its musl node
        if: ${{ matrix.container }}
        run: echo 'ID=alpine' >> /etc/os-release

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark the workspace safe for git
        if: ${{ matrix.container }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set environment variables
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          case "$VARIANT" in
            kheaders)
              echo 'STACKTRACE=no' >> "$GITHUB_ENV"
              echo 'KHEADERS=torvalds/linux' >> "$GITHUB_ENV"
              ;;
            nostacktrace)
              echo 'STACKTRACE=no' >> "$GITHUB_ENV"
              ;;
            musl)
              echo 'STACKTRACE=no' >> "$GITHUB_ENV"
              echo 'MPERS=check' >> "$GITHUB_ENV"
              ;;
            libdw)
              echo 'STACKTRACE=libdw' >> "$GITHUB_ENV"
              ;;
            libunwind)
              echo 'STACKTRACE=libunwind' >> "$GITHUB_ENV"
              ;;
          esac

      - name: install dependencies
        if: ${{ !matrix.container }}
        run: ci/install-dependencies.sh

      - name: build check
        run: ci/run-build-and-tests.sh
